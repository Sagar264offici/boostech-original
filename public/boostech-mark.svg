<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -4 380 336" role="img" aria-label="Boostech">
  <defs>
    <linearGradient id="bGrad" gradientUnits="userSpaceOnUse" x1="26" y1="50" x2="286" y2="276">
      <stop offset="0" stop-color="#38DBFF"/>
      <stop offset="0.44" stop-color="#3E7BFF"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0.02" y1="0.98" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#45C6FF"/>
      <stop offset="0.42" stop-color="#9B4BFF"/>
      <stop offset="0.78" stop-color="#FF4FA3"/>
      <stop offset="1" stop-color="#FFB24D"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D4F4"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A98BFF"/>
      <stop offset="1" stop-color="#3E63FF"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C9"/>
      <stop offset="0.4" stop-color="#FFBE45"/>
      <stop offset="1" stop-color="#FF3D7F"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#B7D0FF" stop-opacity="0.72"/>
    </linearGradient>
    <radialGradient id="sparkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC46B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF7A45" stop-opacity="0"/>
    </radialGradient>

    <mask id="counters" maskUnits="userSpaceOnUse" x="-8" y="-4" width="380" height="336">
      <rect x="-8" y="-4" width="380" height="336" fill="#fff"/>
      <rect x="114" y="70" width="82" height="62" rx="26" fill="#000"/>
      <rect x="114" y="182" width="90" height="64" rx="30" fill="#000"/>
    </mask>
  </defs>

  <!-- B: stem plus asymmetric bowls -->
  <g transform="translate(24 0) skewX(-6)">
    <g mask="url(#counters)" fill="url(#bGrad)">
      <path d="M54 44h46v228H54A20 20 0 0 1 34 252V64a20 20 0 0 1 20-20Z"/>
      <path d="M86 44h110a44 44 0 0 1 44 44v24a44 44 0 0 1-44 44H86V44Z"/>
      <path d="M86 152h110a56 56 0 0 1 56 56v8a56 56 0 0 1-56 56H86V152Z"/>
    </g>
  </g>

  <!-- speed sweep -->
  <path d="M16 300C96 250 176 184 232 132C262 104 288 92 302 86" fill="none"
        stroke="url(#swooshGrad)" stroke-width="17" stroke-linecap="round"/>

  <!-- chart bars in the lower counter -->
  <g fill="url(#barGrad)">
    <rect x="128" y="224" width="14" height="20" rx="5"/>
    <rect x="148" y="212" width="14" height="32" rx="5"/>
    <rect x="168" y="198" width="14" height="46" rx="5"/>
  </g>

  <!-- rocket -->
  <g transform="translate(304 84) rotate(40)">
    <circle cx="10" cy="-62" r="26" fill="url(#sparkGlow)"/>
    <path fill="url(#flameGrad)" d="M-12 8C-9 36-3 58 0 76c3-18 9-40 12-68H-12Z"/>
    <path fill="#FFF9E4" opacity="0.8" d="M-5 10C-4 30-1 46 0 58c1-12 4-28 5-48H-5Z"/>
    <path fill="url(#finGrad)" d="M-23-16-47 22l21-5 8-16-5-17ZM23-16 47 22 26 17l-8-16 5-17Z"/>
    <path fill="url(#bodyGrad)" d="M0-78c19 20 28 48 23 92H-23c-5-44 4-72 23-92Z"/>
    <path fill="#161B3A" d="M0-78c9 10 15 21 18 32h-36c3-11 9-22 18-32Z"/>
    <circle cx="0" cy="-22" r="12" fill="#161B3A"/>
    <circle cx="-3.6" cy="-25" r="3.8" fill="#FFFFFF" opacity="0.55"/>
  </g>
</svg>
